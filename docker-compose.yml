services:
  victim1:
    build:
      context: .
      dockerfile: docker/victim/Dockerfile
    hostname: victim1
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - sentinel_net
    healthcheck:
      test: ["CMD-SHELL", "ss -lnt | grep -q ':22 '"]
      interval: 5s
      timeout: 3s
      retries: 12

  victim2:
    build:
      context: .
      dockerfile: docker/victim/Dockerfile
    hostname: victim2
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - sentinel_net
    healthcheck:
      test: ["CMD-SHELL", "ss -lnt | grep -q ':22 '"]
      interval: 5s
      timeout: 3s
      retries: 12

  victim3:
    build:
      context: .
      dockerfile: docker/victim/Dockerfile
    hostname: victim3
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - sentinel_net
    healthcheck:
      test: ["CMD-SHELL", "ss -lnt | grep -q ':22 '"]
      interval: 5s
      timeout: 3s
      retries: 12

  victim4:
    build:
      context: .
      dockerfile: docker/victim/Dockerfile
    hostname: victim4
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - sentinel_net
    healthcheck:
      test: ["CMD-SHELL", "ss -lnt | grep -q ':22 '"]
      interval: 5s
      timeout: 3s
      retries: 12

  victim5:
    build:
      context: .
      dockerfile: docker/victim/Dockerfile
    hostname: victim5
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - sentinel_net
    healthcheck:
      test: ["CMD-SHELL", "ss -lnt | grep -q ':22 '"]
      interval: 5s
      timeout: 3s
      retries: 12

  attacker:
    build:
      context: .
      dockerfile: docker/attacker/Dockerfile
    hostname: attacker
    depends_on:
      victim1:
        condition: service_healthy
      victim2:
        condition: service_healthy
      victim3:
        condition: service_healthy
      victim4:
        condition: service_healthy
      victim5:
        condition: service_healthy
      kafka:
        condition: service_started
      zookeeper:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - sentinel_net

  zookeeper:
    image: bitnami/zookeeper:3.9
    hostname: zookeeper
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    networks:
      - sentinel_net

  kafka:
    image: bitnami/kafka:3.9
    hostname: kafka
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CLIENT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_LISTENERS: CLIENT://:9092,EXTERNAL://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: CLIENT://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: CLIENT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9093:9093"
    networks:
      - sentinel_net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sentinel_net

  consumer:
    build:
      context: .
      dockerfile: docker/consumer/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinel
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - sentinel_net

networks:
  sentinel_net:
    name: sentinel_net
    driver: bridge

volumes:
  postgres_data:
